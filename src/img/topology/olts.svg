<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg-fill { fill: #d3f4f4; }
      .box-fill { fill: #6ee2f5; }
      .stroke-main {
        fill: none;
        stroke: #0072ce;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Preenchimento Claro do Globo (Background Fill) -->
  <circle cx="256" cy="160" r="142" class="bg-fill" />

  <!-- Preenchimento dos Quadrados Inferiores (Box Fills) -->
  <rect x="85" y="405" width="85" height="85" rx="16" class="box-fill" />
  <rect x="213.5" y="405" width="85" height="85" rx="16" class="box-fill" />
  <rect x="342" y="405" width="85" height="85" rx="16" class="box-fill" />

  <!-- Círculo Exterior do Globo -->
  <circle cx="256" cy="160" r="142" class="stroke-main" />

  <!-- Linha Latitudinal Central (Equador) -->
  <line x1="114" y1="160" x2="398" y2="160" class="stroke-main" />

  <!-- Arcos de Latitude (Superior e Inferior) -->
  <path d="M 172 75 A 155 80 0 0 0 340 75" class="stroke-main" />
  <path d="M 152 230 A 170 85 0 0 0 360 230" class="stroke-main" />

  <!-- Elipse de Longitude Central (Meridiano Oval) -->
  <path d="M 256 18 C 190 60, 190 260, 256 302" class="stroke-main" />
  <path d="M 256 18 C 322 60, 322 260, 256 302" class="stroke-main" />

  <!-- Traços Verticais Internos (Eixo/Segmentos Verticais) -->
  <line x1="256" y1="18" x2="256" y2="58" class="stroke-main" />
  <line x1="256" y1="130" x2="256" y2="190" class="stroke-main" />
  <line x1="256" y1="262" x2="256" y2="302" class="stroke-main" />

  <!-- Conexão Central (Linha Direta do Globo para o Quadrado Central) -->
  <line x1="256" y1="316" x2="256" y2="405" class="stroke-main" />

  <!-- Conexão Esquerda (Linha em 'L' para o Quadrado Esquerdo) -->
  <path d="M 210 316 V 360 H 127.5 V 405" class="stroke-main" />

  <!-- Conexão Direita (Linha em 'L' para o Quadrado Direito) -->
  <path d="M 302 316 V 360 H 384.5 V 405" class="stroke-main" />

  <!-- Bordas dos Quadrados (Outlines) -->
  <rect x="85" y="405" width="85" height="85" rx="16" class="stroke-main" />
  <rect x="213.5" y="405" width="85" height="85" rx="16" class="stroke-main" />
  <rect x="342" y="405" width="85" height="85" rx="16" class="stroke-main" />
</svg>
